[package]
name = "sstv"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = []
image = ["std", "dep:image"]
wav = ["std", "dep:hound"]
mp3 = ["std", "dep:mp3lame-encoder", "dep:minimp3"]

[dependencies]
libm = "0.2.8"
image = { version = "0.25.1", optional = true }
hound = { version = "3.5.1", optional = true }
mp3lame-encoder = { version = "0.2.2", optional = true }
minimp3 = { version = "0.5.1", optional = true }

[dev-dependencies]
image = "0.25.1"
hound = "3.5.1"
flate2 = "1.0.28"
rand = "0.9"
rand_distr = "0.5"

[[example]]
name = "encode"
required-features = ["image", "wav"]

[[example]]
name = "decode"
required-features = ["image", "wav", "mp3"]

[[test]]
name = "image_feature"
required-features = ["image"]

[[test]]
name = "wav_feature"
required-features = ["wav"]

[[test]]
name = "mp3_feature"
required-features = ["mp3"]

[package.metadata.docs.rs]
all-features = true
